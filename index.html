<!DOCTYPE html>
<html>
<head>
    <title>Socket.IO Chat App</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 20px; }
        #chat { width: 100%; max-width: 500px; margin: auto; }
        #messages { background: white; padding: 10px; height: 300px; overflow-y: scroll; border-radius: 5px; }
        #online { margin-top: 10px; }
        #typing { color: gray; font-style: italic; }
    </style>
</head>

<body>
    <div id="chat">
        <h2>Chat App</h2>

        <label>Enter a nickname:</label>
        <input id="nickname" placeholder="Your name" />
        <button onclick="saveNickname()">Save</button>

        <ul id="online"></ul>
        <p id="typing"></p>

        <ul id="messages"></ul>

        <input id="messageInput" placeholder="Type a message..." autocomplete="off" />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const messages = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");
        const typing = document.getElementById("typing");
        const onlineList = document.getElementById("online");

        function saveNickname() {
            const name = document.getElementById("nickname").value.trim();
            if (name) socket.emit("set-nickname", name);
        }

        messageInput.addEventListener("input", () => {
            socket.emit("typing");
        });

        function sendMessage() {
            const msg = messageInput.value;
            if (msg.trim() === "") return;

            // Add message instantly (DO NOT wait for server)
            const li = document.createElement("li");
            li.textContent = "Me: " + msg;
            messages.appendChild(li);

            socket.emit("chat-message", msg);
            messageInput.value = "";
        }

        // When another user sends a message
        socket.on("chat-message", (data) => {
            const li = document.createElement("li");
            li.textContent = `${data.user}: ${data.message}`;
            messages.appendChild(li);
        });

        // Typing indicator
        socket.on("user-typing", (name) => {
            typing.textContent = `${name} is typing...`;
            setTimeout(() => typing.textContent = "", 1500);
        });

        // Notify when a user joins
        socket.on("user-joined", (name) => {
            const li = document.createElement("li");
            li.textContent = `${name} joined the chat`;
            li.style.fontStyle = "italic";
            messages.appendChild(li);
        });

        // Notify when a user leaves
        socket.on("user-left", (name) => {
            const li = document.createElement("li");
            li.textContent = `${name} left the chat`;
            li.style.color = "red";
            li.style.fontStyle = "italic";
            messages.appendChild(li);
        });

        // Online user list
        socket.on("online-users", (users) => {
            onlineList.innerHTML = "<strong>Online:</strong>";
            users.forEach((u) => {
                const li = document.createElement("li");
                li.textContent = u;
                onlineList.appendChild(li);
            });
        });
    </script>
</body>
</html>
